name = "lolgalaxy"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "DAILY"
class_name = "DailyStats"

# SQLite-backed Durable Objects work on the free Workers plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyStats"]

# Post each new daily to Discord just after midnight UTC (only if the DISCORD_WEBHOOK secret is set)
[triggers]
crons = ["2 0 * * *"]
