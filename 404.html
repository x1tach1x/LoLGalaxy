<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – LoL Galaxy</title>
<script>
  // GitHub Pages paths are case-sensitive: send /leaguesim, /LEAGUESIM, etc. to /leagueSim/
  (function(){
    var path = location.pathname;
    var base = location.hostname.endsWith("github.io") ? "/" + path.split("/")[1] + "/" : "/";
    var rest = path.slice(base.length).toLowerCase().replace(/\/+$/, "");
    if (rest === "leaguesim" || rest === "leaguesim/index.html") location.replace(base + "leagueSim/");
  })();
</script>
<style>
body{margin:0;background:#0F1D2C;color:#E9EEF3;font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:60px 18px} a{color:#4EA1DF}
</style>
</head>
<body>
<div class="wrap">
  <h1>That page doesn't exist</h1>
  <p>Check the address, or go to the <a id="home" href="/">LoL Galaxy homepage</a> to play LeagueSim.</p>
  <script>if (location.hostname.endsWith("github.io")) document.getElementById("home").href = "/" + location.pathname.split("/")[1] + "/";</script>
</div>
</body>
</html>
